<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estado Cliente - CRUD</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-4">

      <h2 class="mb-4">Estado de Clientes</h2>

      <!-- Alerta de feedback -->
      <div id="alerta" class="alert d-none" role="alert"></div>

      <!-- Formulario Crear / Editar -->
      <div class="card mb-4">
        <div class="card-header" id="form-titulo">Nuevo Estado</div>
        <div class="card-body">
          <form id="form-estado">
            <input type="hidden" id="campo-id" />
            <div class="row g-3">
              <div class="col-md-4">
                <label for="campo-codigo" class="form-label">Código</label>
                <input type="text" class="form-control" id="campo-codigo" placeholder="Ej: ACTIVO" required />
              </div>
              <div class="col-md-6">
                <label for="campo-descripcion" class="form-label">Descripción</label>
                <input type="text" class="form-control" id="campo-descripcion" placeholder="Descripción del estado" required />
              </div>
              <div class="col-md-2 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-success w-100" id="btn-guardar">Guardar</button>
                <button type="button" class="btn btn-secondary w-100" onclick="cancelarEdicion()">Cancelar</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Tabla -->
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Descripción</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-estados">
          <!-- Datos cargados dinámicamente -->
        </tbody>
      </table>

    </div>

    <!-- Modal de confirmación de eliminación -->
    <div class="modal fade" id="modal-eliminar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirmar eliminación</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            ¿Estás seguro de que deseas eliminar el estado <strong id="modal-nombre-estado"></strong>?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btn-confirmar-eliminar">Eliminar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const API_URL = 'https://localhost:7185/api/estadocliente';
      let modalEliminar;
      let idAEliminar = null;

      // ── Inicialización ─────────────────────────────────────────────────────────
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('form-estado').addEventListener('submit', guardarEstado);
        listarEstados();
      });

      // ── GET ────────────────────────────────────────────────────────────────────
      function listarEstados() {
        fetch(API_URL)
          .then(res => res.json())
          .then(data => renderTabla(data))
          .catch(() => mostrarAlerta('Error al cargar los estados.', 'danger'));
      }

      function renderTabla(data) {
        debugger;
        console.log("data ==> ", data);
        

        const tbody = document.getElementById('tbody-estados');
        tbody.innerHTML = '';

        data.content.forEach(e => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${e.id}</td>
            <td>${e.codigo}</td>
            <td>${e.descripcion}</td>
            <td class="text-center">
              <button class="btn btn-warning btn-sm me-1" onclick="prepararEdicion(${e.id}, '${e.codigo}', '${e.descripcion}')">
                Editar
              </button>
              <button class="btn btn-danger btn-sm" onclick="confirmarEliminar(${e.id}, '${e.codigo}')">
                Eliminar
              </button>
            </td>`;
          tbody.appendChild(tr);
        });
      }

      // ── POST / PUT ─────────────────────────────────────────────────────────────
      function guardarEstado(e) {
        debugger;
        e.preventDefault();

        const id          = document.getElementById('campo-id').value;
        const codigo      = document.getElementById('campo-codigo').value.trim();
        const descripcion = document.getElementById('campo-descripcion').value.trim();

        const esEdicion = id !== '';
        const url       = esEdicion ? `${API_URL}/${id}` : API_URL;
        const metodo    = esEdicion ? 'PUT' : 'POST';

        fetch(url, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigo, descripcion })
        })
          .then(res => {
            if (!res.ok) throw new Error();
            return res.json();
          })
          .then(() => {
            mostrarAlerta(esEdicion ? 'Estado actualizado.' : 'Estado creado.', 'success');
            cancelarEdicion();
            listarEstados();
          })
          .catch(() => mostrarAlerta('Error al guardar el estado.', 'danger'));
      }

      // ── DELETE ─────────────────────────────────────────────────────────────────
      function confirmarEliminar(id, codigo) {
        idAEliminar = id;
        document.getElementById('modal-nombre-estado').textContent = codigo;
        if (!modalEliminar) {
          modalEliminar = new bootstrap.Modal(document.getElementById('modal-eliminar'));
        }
        modalEliminar.show();

        document.getElementById('btn-confirmar-eliminar').onclick = () => {
          fetch(`${API_URL}/${idAEliminar}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(ok => {
              modalEliminar.hide();
              mostrarAlerta(ok ? 'Estado eliminado.' : 'No se pudo eliminar.', ok ? 'success' : 'warning');
              if (ok) listarEstados();
            })
            .catch(() => mostrarAlerta('Error al eliminar.', 'danger'));
        };
      }

      // ── Helpers ────────────────────────────────────────────────────────────────
      function prepararEdicion(id, codigo, descripcion) {
        document.getElementById('campo-id').value          = id;
        document.getElementById('campo-codigo').value      = codigo;
        document.getElementById('campo-descripcion').value = descripcion;
        document.getElementById('form-titulo').textContent = `Editando estado #${id}`;
        document.getElementById('btn-guardar').textContent = 'Actualizar';
      }

      function cancelarEdicion() {
        document.getElementById('form-estado').reset();
        document.getElementById('campo-id').value          = '';
        document.getElementById('form-titulo').textContent = 'Nuevo Estado';
        document.getElementById('btn-guardar').textContent = 'Guardar';
      }

      function mostrarAlerta(mensaje, tipo) {
        const alerta = document.getElementById('alerta');
        alerta.className = `alert alert-${tipo}`;
        alerta.textContent = mensaje;
        alerta.classList.remove('d-none');
        setTimeout(() => alerta.classList.add('d-none'), 3000);
      }
    </script>

  </body>
</html>
