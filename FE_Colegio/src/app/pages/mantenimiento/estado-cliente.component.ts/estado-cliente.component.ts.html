<div class="container py-3">
	<article class="card border-0 shadow-sm">
		<div class="card-header bg-body border-0 pb-0 d-flex justify-content-between align-items-center flex-wrap gap-2">
			<div>
				<h2 class="h6 mb-1 text-uppercase text-body-secondary">Estado Cliente</h2>
				<p class="small text-body-secondary mb-0">Listado de estados de cliente (datos simulados).</p>
			</div>
			<button type="button" class="btn btn-primary btn-sm" (click)="openCreateModal()" aria-label="Nuevo estado">
				<i class="bi bi-plus-circle" aria-hidden="true"></i>
				<span class="visually-hidden">Nuevo estado</span>
			</button>
		</div>

		<div class="card-body">
			<div class="table-responsive">
				<table class="table table-sm table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th scope="col">Id</th>
							<th scope="col">Codigo</th>
							<th scope="col">Descripcion</th>
							<th scope="col" class="text-end">Acciones</th>
						</tr>
					</thead>
					<tbody>
						@for (item of estadosCliente(); track item.Id) {
							<tr>
								<td>{{ item.Id }}</td>
								<td><span class="badge text-bg-secondary">{{ item.Codigo }}</span></td>
								<td>{{ item.Descripcion }}</td>
								<td class="text-end">
									<div class="btn-group btn-group-sm" role="group" aria-label="Acciones de estado cliente">
										<button type="button" class="btn btn-outline-secondary" (click)="openEditModal(item)" aria-label="Editar estado cliente">
											<i class="bi bi-pencil-square" aria-hidden="true"></i>
											<span class="visually-hidden">Editar</span>
										</button>
										<button type="button" class="btn btn-outline-danger" (click)="onDelete(item.Id)" aria-label="Eliminar estado cliente">
											<i class="bi bi-trash3" aria-hidden="true"></i>
											<span class="visually-hidden">Eliminar</span>
										</button>
									</div>
								</td>
							</tr>
						} @empty {
							<tr>
								<td colspan="4" class="text-center text-body-secondary py-4">No hay registros disponibles.</td>
							</tr>
						}
					</tbody>
				</table>
			</div>
		</div>
	</article>
</div>

<app-estado-cliente-modal
	[visible]="showModal()"
	[estado]="selectedEstado()"
	(closed)="closeModal()"
	(saved)="saveEstado($event)"
></app-estado-cliente-modal>
