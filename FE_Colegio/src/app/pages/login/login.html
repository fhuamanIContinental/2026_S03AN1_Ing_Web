<main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-body-tertiary py-4">
	<div class="row w-100 justify-content-center">
		<div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
			<section class="card border-0 shadow-sm">
				<div class="card-body p-4 p-md-5">
					<header class="text-center mb-4">
						<h1 class="h3 fw-bold mb-2">Iniciar sesion</h1>
						<p class="text-body-secondary mb-0">Ingresa tus credenciales para continuar.</p>
					</header>

					<form novalidate>
						<div class="mb-3">
							<label for="username" class="form-label">Usuario</label>
							<input
								id="username"
								name="username"
								type="text"
								class="form-control form-control-lg"
								placeholder="Tu usuario"
								autocomplete="username"
								required
							/>
						</div>

						<div class="mb-4">
							<label for="password" class="form-label">Contrasena</label>
							<input
								id="password"
								name="password"
								type="password"
								class="form-control form-control-lg"
								placeholder="Tu contrasena"
								autocomplete="current-password"
								required
							/>
						</div>

						<div class="d-grid">
							<button type="submit" class="btn btn-primary btn-lg">Entrar</button>
						</div>
					</form>
				</div>
			</section>
		</div>
	</div>
</main>
